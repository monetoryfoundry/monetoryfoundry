<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Monetary Foundry">
  <!-- Halftone field -->
  <defs>
    <pattern id="dots" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1.6" height="1.6" rx="0.2" fill="#E8A86A"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </radialGradient>
    <mask id="ring">
      <circle cx="60" cy="60" r="52" fill="white"/>
      <g fill="black" transform="translate(60 60) rotate(-35)">
        <!-- Outer arc -->
        <path d="M -8 -34 A 35 35 0 1 0 28 20" stroke="black" stroke-width="7" fill="none" stroke-linecap="round"/>
        <!-- Mid arc -->
        <path d="M -2 -24 A 24 24 0 1 0 20 14" stroke="black" stroke-width="7" fill="none" stroke-linecap="round"/>
        <!-- Inner C -->
        <path d="M 4 -14 A 14 14 0 1 0 12 8" stroke="black" stroke-width="9" fill="none" stroke-linecap="round"/>
      </g>
    </mask>
  </defs>
  <circle cx="60" cy="60" r="52" fill="url(#dots)" mask="url(#ring)"/>
  <circle cx="60" cy="60" r="52" fill="url(#fade)"/>
</svg>
